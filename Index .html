async function mblFetchOrders(){
 const db=mblDb();
 const {data:{session},error:se}=await db.auth.getSession();
 if(se)throw se;
 if(!session)throw new Error("Session commerçant expirée.");
 let shopId=window.MBL_ACTIVE_SHOP_ID;
 if(!shopId){
   const {data:shop,error:sh}=await db.from("shops").select("id").eq("owner_id",session.user.id).single();
   if(sh)throw sh; shopId=shop.id; window.MBL_ACTIVE_SHOP_ID=shopId;
 }
 const {data:orders,error:oe}=await db.from("orders").select("id,order_number,customer_name,customer_phone,delivery_place,note,status,payment_method,payment_status,total,created_at").eq("shop_id",shopId).order("created_at",{ascending:false});
 if(oe)throw oe;
 let items=[];
 if(orders?.length){
   const {data:rows,error:ie}=await db.from("order_items").select("order_id,product_id,product_name,quantity,unit_price").in("order_id",orders.map(o=>o.id));
   if(ie)throw ie; items=rows||[];
 }
 const map={};items.forEach(i=>(map[i.order_id]||(map[i.order_id]=[])).push(i));
 window.MBL_CLOUD_ORDERS=(orders||[]).map(o=>({...o,order_items:map[o.id]||[]}));
 setTimeout(()=>{try{window.mblRefreshOrderDot()}catch(e){}},0);
 return window.MBL_CLOUD_ORDERS;
}

async function validateSale(orderId){
 const o=(window.MBL_CLOUD_ORDERS||[]).find(x=>x.id===orderId);
 if(!o || o.status==="Vente validée")return;
 if(!confirm("Valider cette vente ? Le stock sera diminué automatiquement."))return;
 try{
   const db=mblDb();
   for(const item of (o.order_items||[])){
     if(!item.product_id)throw new Error("Produit introuvable dans cette commande.");
     const qty=Math.max(1,Number(item.quantity||1));
     const {data:p,error:pe}=await db.from("products").select("id,stock").eq("id",item.product_id).single();
     if(pe)throw pe;
     if(Number(p.stock||0)<qty)throw new Error("Stock insuffisant pour "+item.product_name);
     const {error:ue}=await db.from("products").update({stock:Number(p.stock)-qty}).eq("id",p.id);
     if(ue)throw ue;
   }
   const {error:oe}=await db.from("orders").update({status:"Vente validée"}).eq("id",orderId);
   if(oe)throw oe;
   o.status="Vente validée";
   await mblLoadCloudProducts();
   toast("Vente validée · stock mis à jour ✓");
   window.MBL_ORDER_TAB="done";
   await ordersPage();
 }catch(e){
   console.error("validate sale",e);
   toast(e.message||"Impossible de valider la vente.");
 }
}

async function changeOrderStatus(id,status){

   const o=(window.MBL_CLOUD_ORDERS||[]).find(x=>x.id===id);if(o)o.status=status;
   toast("Statut mis à jour ✓");
 }catch(e){console.error(e);toast("Impossible de modifier le statut.");}
}

   }
 })();

   const msg=String(error.message||"");

    <button class="authbtn" onclick="mblContinueSignup()">✓ J’ai confirmé</button>
    <button class="linkbtn" onclick="authHome()">Retour</button></div></div>`;
   return;

async function mblExistingAccountLogin(){
 let d=MBL_SIGNUP;
 if(!d){try{d=JSON.parse(sessionStorage.getItem("mbl_signup_pending")||"null")}catch(_){}}
 if(!d){authHome();return}
 try{
   const db=mblDb();
   const {data,error}=await db.auth.signInWithPassword({email:d.email,password:d.password});
   if(error||!data?.session){
     toast("Mot de passe incorrect ou e-mail non confirmé.");
     return;
   }
   const {data:shop,error:qerr}=await db.from("shops")
     .select("id,name,slug,country_code,currency_code,whatsapp,tagline")
     .eq("owner_id",data.session.user.id).maybeSingle();
   if(qerr)throw qerr;
   if(shop){
     window.MBL_ACTIVE_SHOP_ID=shop.id;
     localStorage.setItem("mbl_v23_session","yes");
     localStorage.setItem("mbl_shop",shop.name);
     localStorage.setItem("mbl_slug",shop.slug);
     localStorage.setItem("mbl_country",shop.country_code);
     localStorage.setItem("mbl_currency",shop.currency_code);
     localStorage.setItem("mbl_wa",shop.whatsapp||"");
     localStorage.setItem("mbl_tag",shop.tagline||"");
     products=[]; await mblLoadCloudProducts(); merchant(); toast("Boutique retrouvée ✓");
     return;
   }
   /* Compte réel existant mais boutique absente : terminer seulement la création de boutique. */
   await mblCreateShop(data.session,d);
 }catch(e){
   console.error("existing account",e);
   toast("Connexion : "+(e?.message||"échec"));
 }
}

async function mblCreateShop(session,d){
 const db=mblDb(), uid=session.user.id;
 let {data:shop,error:qerr}=await db.from("shops").select("id,name,slug,country_code,currency_code,whatsapp,tagline").eq("owner_id",uid).maybeSingle();
 if(qerr)throw qerr;
 if(!shop){
  const res=await db.from("shops").insert({
   owner_id:uid,name:d.shop,slug:mblCleanSlug(d.shop)+"-"+uid.slice(0,6),
   country_code:d.cc,currency_code:countryData(d.cc)[4],
   whatsapp:fullInternationalNumber(d.cc,d.wa||d.ph),tagline:d.tag||"",is_active:true
  }).select("id,name,slug,country_code,currency_code,whatsapp,tagline").single();
  if(res.error)throw res.error; shop=res.data;
 }
 window.MBL_ACTIVE_SHOP_ID=shop.id;
 localStorage.setItem("mbl_v23_session","yes");
 localStorage.setItem("mbl_shop",shop.name);
 localStorage.setItem("mbl_slug",shop.slug);
 localStorage.setItem("mbl_country",shop.country_code);
 localStorage.setItem("mbl_currency",shop.currency_code);
 localStorage.setItem("mbl_wa",shop.whatsapp||"");
 localStorage.setItem("mbl_tag",shop.tagline||"");
 try{sessionStorage.removeItem("mbl_signup_pending")}catch(_){}
 MBL_SIGNUP=null; products=[]; await mblLoadCloudProducts(); merchant(); toast("Boutique créée ✓");

<script>

let MBL_DB=null;

async function mblRealLogin(){
  const email=(document.getElementById("loginId")?.value||"").trim();
  const password=document.getElementById("loginPw")?.value||"";
  if(!email || !email.includes("@")){toast("Saisissez l’e-mail du compte commerçant.");return;}
  if(!password){toast("Saisissez votre mot de passe.");return;}
  try{

    if(error) throw error;
    const {data:shop,error:se}=await mblDb().from("shops").select("id,name,slug,country_code,currency_code,whatsapp,tagline").eq("owner_id",data.user.id).single();
    if(se) throw new Error("Aucune boutique liée à ce compte.");

async function mblCloudLogout(){

async function mblSaveProductCloud(){
  const categoryEl=document.getElementById("fCat");
  const name=(document.getElementById("fName")?.value||"").trim();
  const price=Number(document.getElementById("fPrice")?.value);
  const stock=Math.max(0,Number(document.getElementById("fStock")?.value)||0);
  const oldPrice=Number(document.getElementById("fOld")?.value)||null;
  const description=(document.getElementById("fDesc")?.value||"").trim();
  if(!categoryEl?.value){toast("Choisissez d’abord une catégorie.");return;}
  if(!name){toast("Veuillez saisir le nom de l’article.");return;}
  if(!price||price<=0){toast("Veuillez saisir un prix valide.");return;}
  try{
    const db=mblDb();
    const {data:{session}}=await db.auth.getSession();
    const user=session?.user;
    if(!user){toast("Session expirée. Reconnectez-vous depuis l’accueil.");return;}
    let shopId=window.MBL_ACTIVE_SHOP_ID;
    if(!shopId){const {data:shop,error}=await db.from("shops").select("id").eq("owner_id",user.id).single();if(error)throw error;shopId=shop.id;window.MBL_ACTIVE_SHOP_ID=shopId;}
    const payload={shop_id:shopId,name,description,category:categoryEl.value,price,old_price:oldPrice,stock,is_active:true};
    const editing=editId!==null && typeof editId==="string";
    let productId=editId;
    if(editing){const {error}=await db.from("products").update(payload).eq("id",editId);if(error)throw error;}
    else{const {data,error}=await db.from("products").insert(payload).select("id").single();if(error)throw error;productId=data.id;}
    /* V27.2 : envoi des 1 à 3 photos sélectionnées vers Supabase Storage. */
    const selectedPhotos=(Array.isArray(photos)?photos:[]).filter(Boolean).slice(0,3);
    if(selectedPhotos.length){
      const uploaded=[];
      for(let i=0;i<selectedPhotos.length;i++){
        const dataUrl=selectedPhotos[i];
        const blob=await (await fetch(dataUrl)).blob();
        const path=`${user.id}/${productId}/photo-${i+1}-${Date.now()}.jpg`;
        const {error:upErr}=await db.storage.from("shop-media").upload(path,blob,{contentType:"image/jpeg",upsert:false});
        if(upErr) throw upErr;
        uploaded.push({product_id:productId,storage_path:path,position:i+1});
      }
      /* Si l'utilisateur a choisi de nouvelles photos lors d'une modification,
         elles deviennent la nouvelle galerie de ce produit. */
      if(editing){
        const {error:delRowsErr}=await db.from("product_photos").delete().eq("product_id",productId);
        if(delRowsErr) throw delRowsErr;
      }
      const {error:photoRowsErr}=await db.from("product_photos").insert(uploaded);
      if(photoRowsErr) throw photoRowsErr;
    }
    editId=null; document.getElementById("formModal").style.display="none";
    await mblLoadCloudProducts(); merchant(); toast(editing?"Article modifié dans le Cloud ✓":"Article enregistré dans le Cloud ✓");
  }catch(e){console.error("V27 save",e);toast("Enregistrement Cloud impossible. Vérifiez votre connexion.");}
}

async function mblSalesSummary(){

   const weekStart=new Date(dayStart);
   const mondayOffset=(dayStart.getDay()+6)%7;
   weekStart.setDate(dayStart.getDate()-mondayOffset);
   const monthStart=new Date(now.getFullYear(),now.getMonth(),1);

   const out={
     day:{count:0,total:0},week:{count:0,total:0},

   b.onclick=()=>{const show=inp.type==="password";inp.type=show?"text":"password";b.textContent=show?"🙈":"👁";b.setAttribute("aria-label",show?"Masquer le mot de passe":"Afficher le mot de passe")};
   wrap.appendChild(b);
 });
}
const mblPwdObs=new MutationObserver(mblPasswordToggles);
mblPwdObs.observe(document.getElementById("app")||document.body,{childList:true,subtree:true});
window.addEventListener("load",mblPasswordToggles);
</script>

<script>
/* V28 — séparation stricte client/commerçant sur les liens publics */
(function(){
  const params = new URLSearchParams(location.search);
  const PUBLIC_SHOP = params.has("shop");
  if(!PUBLIC_SHOP) return;

  window.MBL_STRICT_PUBLIC = true;

  function forceClient(){
    try { role="client"; } catch(e){}
    try { clientTab = clientTab || "home"; } catch(e){}
  }

  /* Le dialogue "Passer à l'espace commerçant ?" ne doit jamais apparaître en public. */
  const nativeConfirm = window.confirm.bind(window);
  window.confirm = function(message){
    const m = String(message||"").toLowerCase();
    if(m.includes("espace commer") || m.includes("merchant")) return false;
    return nativeConfirm(message);
  };

  function securePublicUI(){
    forceClient();
    document.querySelectorAll("button,a,[onclick],[role='button']").forEach(el=>{
      const text=(el.textContent||"").trim().toLowerCase();
      const oc=(el.getAttribute("onclick")||"").toLowerCase();
      const title=(el.getAttribute("title")||"").toLowerCase();
      const merchantAccess =
        text.includes("espace commerçant") || text.includes("espace commercant") ||
        text.includes("mode commerçant") || text.includes("mode commercant") ||
        text.includes("tableau de bord") ||
        title.includes("commerçant") || title.includes("commercant") ||
        oc.includes("merchant(") || oc.includes("loginscreen(") ||
        oc.includes("authhome(") || oc.includes("createscreen(");
      if(merchantAccess){
        el.style.display="none";
        el.setAttribute("aria-hidden","true");
        el.tabIndex=-1;
        el.onclick=function(ev){ev&&ev.preventDefault();return false};
      }
    });
  }

  window.addEventListener("load",()=>{
    forceClient();
    securePublicUI();
    const app=document.getElementById("app")||document.body;
    new MutationObserver(securePublicUI).observe(app,{childList:true,subtree:true,attributes:true,attributeFilter:["onclick","style","class"]});
  },{once:true});

  /* Hard block known merchant-entry functions on a public URL. */
  window.addEventListener("load",()=>{
    ["merchant","loginScreen","authHome","createScreen","createShopStep"].forEach(name=>{
      const original=window[name];
      if(typeof original==="function"){
        window[name]=function(){
          if(window.MBL_STRICT_PUBLIC){ forceClient(); securePublicUI(); return false; }
          return original.apply(this,arguments);
        };
      }
    });
  },{once:true});
})();
</script>


<script>
/* V29 — aucun menu supérieur gauche dans l'espace client public */
(function(){
  if(!(new URLSearchParams(location.search)).has("shop")) return;
  function hideTopLeftMenu(){
    document.querySelectorAll("button,a,[onclick]").forEach(function(el){
      const txt=(el.textContent||"").trim();
      const oc=(el.getAttribute("onclick")||"").toLowerCase();
      const aria=(el.getAttribute("aria-label")||"").toLowerCase();
      /* bouton hamburger / trois-points de l'en-tête client */
      if(txt==="☰" || txt==="⋮" || txt==="..." ||
         aria.includes("menu") ||
         oc.includes("clientmenu") || oc.includes("openmenu") || oc.includes("togglemenu")){
        const r=el.getBoundingClientRect();
        if(r.top < 180 && r.left < 150){
          el.style.display="none";
          el.setAttribute("aria-hidden","true");
          el.tabIndex=-1;
        }
      }
    });
  }
  window.addEventListener("load",()=>{
    hideTopLeftMenu();
    new MutationObserver(hideTopLeftMenu).observe(document.getElementById("app")||document.body,{childList:true,subtree:true});
  },{once:true});
})();
</script>


<script>
/* V32 — l'espace client public n'a pas de "Mon compte" */
(function(){
 if(!(new URLSearchParams(location.search)).has("shop")) return;

 function removeClientAccount(){
   /* Si une ancienne action tente d'ouvrir Compte, retour accueil. */
   try{
     if(typeof clientTab!=="undefined" && (clientTab==="account" || clientTab==="compte")){
       clientTab="home";
       if(typeof renderClient==="function") renderClient();
     }
   }catch(e){}

   /* Supprimer l'onglet Compte de la barre basse. */
   [...document.querySelectorAll("*")].forEach(el=>{
     if(el.children.length) return;
     const t=(el.textContent||"").trim().toLowerCase();
     if(t!=="compte") return;
     let item=el;
     while(item.parentElement){
       const r=item.getBoundingClientRect();
       if(r.top>window.innerHeight*.65 && item.parentElement.children.length>=4) break;
       item=item.parentElement;
     }
     if(item.getBoundingClientRect().top>window.innerHeight*.60){
       item.remove();
     }
   });

   /* Recentrer les 4 entrées restantes de la navigation basse. */
   [...document.querySelectorAll("nav,.bottomnav,.bottom-nav,[class*='bottom']")].forEach(nav=>{
     const r=nav.getBoundingClientRect();
     if(r.top>window.innerHeight*.60){
       const visible=[...nav.children].filter(x=>getComputedStyle(x).display!=="none");
       if(visible.length===4){
         nav.style.display="grid";
         nav.style.gridTemplateColumns="repeat(4,1fr)";
         nav.style.alignItems="center";
         nav.style.justifyItems="center";
       }
     }
   });
 }
 window.addEventListener("load",()=>{
   removeClientAccount();
   new MutationObserver(removeClientAccount).observe(document.getElementById("app")||document.body,{childList:true,subtree:true});
 },{once:true});
})();
</script>

<script>
/* V34 TEST — moyens de paiement synchronisés dans Supabase */
(function(){
 async function loadCloudPayments(){
   const sid=window.MBL_ACTIVE_SHOP_ID;
   if(!sid)return false;
   try{
     const {data,error}=await mblDb().from("shop_payment_methods")
       .select("method_id,label,enabled,account_ref").eq("shop_id",sid);
     if(error)throw error;
     const mobile={}; let delivery=true;
     (data||[]).forEach(r=>{
       if(r.method_id==="delivery") delivery=r.enabled!==false;
       else mobile[r.method_id]={enabled:r.enabled===true,number:r.account_ref||"",label:r.label||r.method_id};
     });
     localStorage.setItem("mbl_payments",JSON.stringify({delivery,mobile,cloud:true}));
     return true;
   }catch(e){console.error("payments load",e);return false;}
 }
 window.mblLoadPaymentMethodsCloud=loadCloudPayments;

 window.saveCountryPayments=async function(){
   const sid=window.MBL_ACTIVE_SHOP_ID;
   if(!sid){toast("Boutique introuvable.");return;}
   const country=localStorage.getItem("mbl_country")||"BF";
   const ops=countryMobilePayments();
   const mobile={};
   document.querySelectorAll(".countryPayCheck").forEach(ch=>{
     const id=ch.dataset.pay;
     const num=document.querySelector(`.countryPayNum[data-pay="${id}"]`)?.value.trim()||"";
     mobile[id]={enabled:ch.checked,number:num};
   });
   const delivery=$("payDelivery2")?.checked||false;
   if(!delivery&&!Object.values(mobile).some(x=>x.enabled)){toast("Activez au moins un mode de paiement.");return;}
   for(const [id,x] of Object.entries(mobile)){
     if(x.enabled&&!x.number){toast("Saisissez le numéro du moyen de paiement activé.");return;}
   }
   try{
     const rows=[{shop_id:sid,method_id:"delivery",label:"Paiement à la livraison",enabled:delivery,account_ref:null}];
     ops.forEach(([id,label])=>rows.push({shop_id:sid,method_id:id,label,enabled:!!mobile[id]?.enabled,account_ref:mobile[id]?.number||null}));
     const {error}=await mblDb().from("shop_payment_methods").upsert(rows,{onConflict:"shop_id,method_id"});
     if(error)throw error;
     localStorage.setItem("mbl_payments",JSON.stringify({delivery,mobile,cloud:true}));
     toast("Moyens de paiement enregistrés dans le Cloud ✓");
   }catch(e){console.error("payments save",e);toast("Impossible d’enregistrer les paiements.");}
 };

 window.availablePaymentsHTML=function(prefix){
   const p=dynamicPaymentConfig();
   const configured=countryMobilePayments().filter(([id])=>p.mobile?.[id]?.enabled);
   let h=`<div class="payMethods">`;
   if(p.delivery!==false)h+=`<label class="payChoice" onclick="toggleMobilePay('${prefix}',false)"><input type="radio" name="${prefix}PayType" value="delivery" checked onchange="toggleMobilePay('${prefix}',false)"><b>🚚 Paiement à la livraison</b></label>`;
   if(configured.length){
     h+=`<label class="payChoice" onclick="toggleMobilePay('${prefix}',true)"><input type="radio" name="${prefix}PayType" value="mobile" ${p.delivery===false?'checked':''} onchange="toggleMobilePay('${prefix}',true)"><b>📱 Paiement mobile</b></label>`;
     h+=`<div id="${prefix}MobileBox" style="display:${p.delivery===false?'block':'none'};margin:4px 0 10px 28px"><div class="muted" style="margin-bottom:6px">Choisissez votre moyen de paiement mobile</div>`;
     h+=configured.map((x,i)=>`<label class="payChoice"><input type="radio" name="${prefix}Mobile" value="${x[0]}" ${i===0?'checked':''} onchange="mblShowPayInstruction('${prefix}')"><b>${x[1]}</b></label>`).join("");
     h+=`<div id="${prefix}PayInstruction" class="setting" style="margin-top:8px;background:#f7f8ff"></div></div>`;
   }
   if(p.delivery===false&&!configured.length)h+=`<div class="muted">Aucun moyen de paiement activé.</div>`;
   return h+`</div>`;
 };
 const oldToggle=window.toggleMobilePay;
 window.toggleMobilePay=function(prefix,show){oldToggle(prefix,show);if(show)setTimeout(()=>mblShowPayInstruction(prefix),0)};
 window.mblShowPayInstruction=function(prefix){
   const id=document.querySelector(`input[name="${prefix}Mobile"]:checked`)?.value;
   const box=$(prefix+"PayInstruction"); if(!box||!id)return;
   const num=paymentNumber(id), label=paymentLabel(id);
   box.innerHTML=`<b>${label}</b><div style="margin-top:5px">Numéro de paiement : <b>${num||"Non configuré"}</b></div>`;
 };

 const originalSettings=window.settings;
 window.settings=async function(){await loadCloudPayments();originalSettings();};

 window.addEventListener("load",()=>setTimeout(async()=>{
   if(!window.MBL_ACTIVE_SHOP_ID)return;
   const ok=await loadCloudPayments();
   if(ok&&isPublicShopEntry()){role="client";renderClient();}
 },500));
})();
</script>


<script>
/* V35 — persistance robuste après actualisation + repli local produits */
(function(){
 const CACHE_KEY='mbl_v27_cloud_products';
 function restoreCachedProducts(){
   try{
     const cached=JSON.parse(localStorage.getItem(CACHE_KEY)||'[]');
     if(Array.isArray(cached) && cached.length){
       products=cached;
       if(typeof role!=='undefined' && role==='client' && typeof renderClient==='function') renderClient();
       else if(typeof role!=='undefined' && role==='merchant' && typeof merchant==='function') merchant();
       return true;
     }
   }catch(e){ console.warn('V35 cache local',e); }
   return false;
 }
 window.MBL_RESTORE_LOCAL_PRODUCTS=restoreCachedProducts;
 window.addEventListener('load',async()=>{
   /* Affichage immédiat du dernier catalogue connu pendant la reconnexion. */
   restoreCachedProducts();
   if(typeof isPublicShopEntry==='function' && isPublicShopEntry()) return;
   try{
     const db=mblDb();
     const {data:{session}}=await db.auth.getSession();
     if(!session) return;
     const {data:shop,error}=await db.from('shops')
       .select('id,name,slug,country_code,currency_code,whatsapp,tagline')
       .eq('owner_id',session.user.id).single();
     if(error||!shop) return;
     window.MBL_ACTIVE_SHOP_ID=shop.id;
     localStorage.setItem('mbl_v23_session','yes');
     if(shop.slug)localStorage.setItem('mbl_slug',shop.slug);
     if(shop.name)localStorage.setItem('mbl_shop',shop.name);
     if(shop.country_code)localStorage.setItem('mbl_country',shop.country_code);
     if(shop.currency_code)localStorage.setItem('mbl_currency',shop.currency_code);
     if(shop.whatsapp)localStorage.setItem('mbl_wa',shop.whatsapp);
     localStorage.setItem('mbl_tag',shop.tagline||'');
     if(typeof mblLoadCloudProducts==='function') await mblLoadCloudProducts();
   }catch(e){
     console.warn('V35 restauration session hors ligne',e);
     restoreCachedProducts();
   }
 },{once:true});
})();
</script>
